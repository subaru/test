<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nihon-tidy デモ</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 15px/1.6 system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 16px 0; }
  button, input[type=file] { font: inherit; }
  #status { opacity: .7; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>nihon-tidy デモ</h1>
  <p>CSV・JSON・Excel（.xlsx）・HTML（スクレイピング結果）・テキストのファイルを選ぶと、ブラウザの中だけで正規化して表示します（データは外部に送信されません）。</p>
  <div class="bar">
    <input type="file" id="file" accept=".csv,.tsv,.txt,.json,.xlsx,.html,.htm">
    <button id="sample">サンプル（CSV）</button>
    <button id="sample-xlsx">サンプル（Excel）</button>
    <button id="sample-html">サンプル（HTML）</button>
    <button id="sample-text">サンプル（テキスト）</button>
    <select id="view" aria-label="表示形式"><option value="table">表</option><option value="cards">カード</option></select>
    <button id="report" disabled>分析レポートを開く</button>
    <span id="status"></span>
  </div>
  <div id="review"></div>
  <div id="app"></div>
</main>

<script type="module">
  // npm公開後は import { tidy } from 'https://cdn.jsdelivr.net/npm/nihon-tidy/+esm' に置き換えられる
  import { tidy } from '../src/index.js';

  let result, controller;
  let loading = 0; // 遅い読み込みが、後から選んだファイルの結果を上書きしないように
  const view = document.getElementById('view');
  const status = document.getElementById('status');
  const reportBtn = document.getElementById('report');

  async function load(input) {
    const ticket = ++loading;
    let next;
    try {
      next = await tidy(input);
    } catch (error) {
      if (ticket === loading) status.textContent = `読み込めませんでした：${error.message}`;
      return;
    }
    if (ticket !== loading) return;
    result = next;
    controller = result.render('#app', { view: view.value });
    // 要確認を直すと、表示も変更ログもその場で更新される
    result.renderReview('#review', { onChange: () => { controller.refresh(); showStatus(); } });
    showStatus();
    reportBtn.disabled = false;
  }

  function showStatus() {
    const applied = result.changes.filter((c) => c.applied).length;
    status.textContent = `${applied}件を正規化、表記ゆれ ${result.clusters.length}組、要確認 ${result.issues.length}件（${result.meta.sheet ? `シート：${result.meta.sheet}` : `${result.meta.how ? `${result.meta.how}、` : ''}文字コード：${result.meta.encoding ?? '-'}`}）`;
  }

  document.getElementById('file').addEventListener('change', (e) => e.target.files[0] && load(e.target.files[0]));
  const loadSample = async (name) => {
    const res = await fetch(`./${name}`);
    if (!res.ok) return (status.textContent = `${name} を読み込めません（${res.status}）`);
    load(Object.assign(await res.blob(), { name }));
  };
  document.getElementById('sample').addEventListener('click', () => loadSample('sample-sjis.csv'));
  document.getElementById('sample-xlsx').addEventListener('click', () => loadSample('sample.xlsx'));
  document.getElementById('sample-html').addEventListener('click', () => loadSample('sample-scrape.html'));
  document.getElementById('sample-text').addEventListener('click', () => loadSample('sample-kv.txt'));
  view.addEventListener('change', () => controller?.setView(view.value));
  reportBtn.addEventListener('click', () => {
    const url = URL.createObjectURL(new Blob([result.toReport()], { type: 'text/html' }));
    window.open(url, '_blank', 'noopener');
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  });
</script>
</body>
</html>
